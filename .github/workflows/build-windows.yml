name: Build Windows setup

on:
  workflow_dispatch: # manuell starten: GitHub > Actions > "Build Windows setup" > Run workflow
  push:
    tags:
      - 'v*' # z. B. v0.3.2: baut das Setup und hängt es an eine Release-Seite (öffentlicher Download)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Tests
        run: npm test

      - name: Build setup (.exe)
        shell: bash
        run: |
          npm run dist || {
            echo "::warning::Build mit Wartungs-Menue fehlgeschlagen, baue ohne build/installer.nsh"
            mv build/installer.nsh build/installer.nsh.off
            npm run dist
          }

      - name: Provide setup as download
        uses: actions/upload-artifact@v4
        with:
          name: GoTrack-Setup
          path: dist/GoTrack-Setup-*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GoTrack-Setup-*.exe
